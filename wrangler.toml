name = "docker-mirrors"
main = "src/index.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true
head_sampling_rate = 1

# The custom domain is declared here so every build attaches it. A custom
# domain can only belong to one Worker, so detach it elsewhere first.
routes = [{ pattern = "docker.i-yongqi.xyz", custom_domain = true }]

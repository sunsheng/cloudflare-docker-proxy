name = "cloudflare-docker-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The username is not secret, so it lives here. LOGIN_PASS is a dashboard Secret
# (Worker -> Settings -> Variables and Secrets), so the password never enters
# this public repo. Until that Secret exists the Worker answers 503.
[vars]
LOGIN_USER = "docker-user"

[observability]
enabled = true
head_sampling_rate = 1

# The custom domain is declared here so every build attaches it. A custom
# domain can only belong to one Worker, so detach it elsewhere first.
routes = [{ pattern = "docker.i-yongqi.xyz", custom_domain = true }]
